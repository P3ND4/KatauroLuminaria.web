<div class="wrapper">
    @if (!loading) {

    <div class="main">

        <header class="header">

            <div class="title">
                <div class="date-n-name">
                    <p>{{blog.createdAt | date: 'd MMM y'}}</p>
                    <h1>{{blog.title}}</h1>
                </div>
                <div class="tags">
                    @for (tag of blog.tags; track $index) {
                    <div class="tag-txt" [style.backgroundColor]="tag.tag.bgColor">
                        <p [style.color]="tag.tag.color">{{tag.tag.name}}</p>
                    </div>
                    }
                </div>
            </div>

            <div class="header-image">
                <img [ngSrc]="blog.images[0].link" width="800" height="400" alt="avatar" class="avatar" priority>
            </div>

        </header>

        <div class="blog-preview">
            <h2>Introducción</h2>

            <p>{{blog.introduction}}</p>


            @for (item of getContent(); track $index) {
            <div class="ql-editor" [innerHTML]="item.content"></div>
            }
        </div>

        <div class="scroll-marker" data-scroll="25"></div>
        <div class="scroll-marker" data-scroll="50"></div>
        <div class="scroll-marker" data-scroll="75"></div>
        <div class="scroll-marker" data-scroll="100"></div>

    </div>
    }
</div>
